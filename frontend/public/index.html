<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cargando...</title>
  <meta name="description" content="Enlaces disponibles">
  <meta property="og:title" content="Enlaces">
  <meta property="og:description" content="Enlaces disponibles">
  <meta property="og:type" content="website">
  <meta name="theme-color" content="#d4829c">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <main id="app" class="container" role="main">
    <header class="header">
      <div class="logo-placeholder" aria-hidden="true">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/>
          <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
        </svg>
      </div>
      <h1 class="site-title" id="site-title">Cargando...</h1>
      <p class="site-description" id="site-description"></p>
    </header>

    <section class="links-container" id="links-container" aria-label="Enlaces disponibles">
      <div class="skeleton-card" aria-hidden="true"></div>
      <div class="skeleton-card" aria-hidden="true"></div>
      <div class="skeleton-card" aria-hidden="true"></div>
    </section>

    <div class="error-state" id="error-state" role="alert" hidden>
      <div class="error-icon" aria-hidden="true">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
          <line x1="12" y1="9" x2="12" y2="13"/>
          <line x1="12" y1="17" x2="12.01" y2="17"/>
        </svg>
      </div>
      <p class="error-message">No se pudieron cargar los enlaces.</p>
      <button class="retry-button" id="retry-button" type="button">
        Reintentar
      </button>
    </div>
  </main>

  <footer class="footer">
    <p>&copy; 2026</p>
  </footer>

  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
