<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Página no encontrada - 404</title>
  <meta name="theme-color" content="#d4829c">
  <style>
    :root {
      --color-primary: #d4829c;
      --color-primary-hover: #c06f89;
      --color-bg: #fdf6f8;
      --color-text-primary: #2d1f24;
      --color-text-secondary: #7a6069;
      --color-focus-ring: #d4829c;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 16px; -webkit-text-size-adjust: 100%; }
    body { 
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; 
      background-color: var(--color-bg); 
      color: var(--color-text-primary); 
      min-height: 100vh; 
      display: flex; 
      flex-direction: column; 
    }
    .container {
      max-width: 480px;
      width: 100%;
      margin: 0 auto;
      padding: 32px 16px;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
    }
    .icon {
      color: var(--color-text-secondary);
      margin-bottom: 24px;
    }
    h1 { font-size: 1.5rem; margin-bottom: 12px; }
    p { color: var(--color-text-secondary); margin-bottom: 32px; }
    .back-link {
      background: var(--color-primary);
      color: white;
      text-decoration: none;
      padding: 12px 24px;
      border-radius: 10px;
      font-weight: 500;
      transition: background 0.2s ease;
    }
    .back-link:hover { background: var(--color-primary-hover); }
    .back-link:focus-visible { outline: 2px solid var(--color-focus-ring); outline-offset: 2px; }
  </style>
</head>
<body>
  <main class="container" role="main">
    <div class="icon" aria-hidden="true">
      <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"></circle>
        <line x1="15" y1="9" x2="9" y2="15"></line>
        <line x1="9" y1="9" x2="15" y2="15"></line>
      </svg>
    </div>
    <h1>Página no encontrada</h1>
    <p>Lo sentimos, la página que buscas no existe.</p>
    <a href="/" class="back-link">Volver al inicio</a>
  </main>
</body>
</html>
